<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YKE Studios</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      background: #0d0d0d;
      border-bottom: 1px solid #222;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      letter-spacing: 0.04em;
    }
    .nav-links a {
      color: #999;
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: #fff; }

    /* HERO */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5rem 2rem 3rem;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    .hero p {
      font-size: 1.1rem;
      color: #888;
      max-width: 500px;
      line-height: 1.6;
    }

    /* APPS */
    .apps {
      padding: 3rem 2rem 5rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    .apps h2 {
      font-size: 1rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.5rem;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .app-card {
      background: #1a1a1a;
      border: 1px solid #252525;
      border-radius: 12px;
      padding: 1.5rem;
      transition: border-color 0.2s;
    }
    .app-card:hover { border-color: #444; }
    .app-card h3 {
      font-size: 1.05rem;
      color: #fff;
      margin-bottom: 0.4rem;
    }
    .app-card p {
      font-size: 0.88rem;
      color: #777;
      line-height: 1.5;
      margin-bottom: 1rem;
    }
    .app-card a {
      font-size: 0.82rem;
      color: #aaa;
      text-decoration: none;
      border: 1px solid #333;
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .app-card a:hover { color: #fff; border-color: #666; }

    /* FOOTER */
    footer {
      background: #0d0d0d;
      border-top: 1px solid #1e1e1e;
      text-align: center;
      padding: 1.2rem;
      font-size: 0.8rem;
      color: #444;
    }
    footer a { color: #555; text-decoration: none; }
    footer a:hover { color: #aaa; }
  </style>
</head>
<body>

  <nav>
    <a class="nav-brand" href="/">YKE Studios</a>
    <div class="nav-links">
      <a href="mailto:ykekizoglu@gmail.com">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <h1>YKE Studios</h1>
    <p>Building mobile apps. Simple, useful, and well-designed.</p>
  </section>

  <section class="apps">
    <h2>Apps</h2>
    <div class="app-grid">
      <div class="app-card">
        <h3>Su Vakti</h3>
        <p>Track your daily water intake. Set goals and reminders.</p>
        <a href="/suvakti/">Privacy Policy</a>
      </div>
    </div>
  </section>

  <footer>
    &copy; 2026 YKE Studios &mdash; Yusuf Kenan Ekizoğlu &mdash;
    <a href="mailto:ykekizoglu@gmail.com">ykekizoglu@gmail.com</a>
  </footer>

</body>
</html>
